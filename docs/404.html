  <body class="bg-slate-50 text-slate-900 antialiased" style="background-color: #f8fafc; color: #0f172a; min-height: 100vh;">
    <!-- Hidden Google Website Translator Element for Full-Platform DOM Translation Fallback -->
    <div id="google_translate_element" style="display:none; visibility:hidden; position:absolute; left:-9999px; width:0; height:0; overflow:hidden;"></div>
    <script type="text/javascript">
      window.googleTranslateElementInit = function() {
        try {
          if (window.google && window.google.translate && window.google.translate.TranslateElement) {
            new window.google.translate.TranslateElement({
              pageLanguage: 'en',
              includedLanguages: 'en,ta,hi,te,kn,ml,es,fr',
              autoDisplay: false,
              layout: window.google.translate.TranslateElement.InlineLayout.SIMPLE
            }, 'google_translate_element');
          }
        } catch(e) {
          console.debug('Translate init note:', e);
        }
      };
    </script>
    <script type="text/javascript" src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit" async defer></script>

    <div id="root"></div>
  </body>
