services:
  # 1. FoodCovering 2.0 Web Application (Frontend)
  - type: web
    name: foodcovering-frontend
    env: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_BACKEND_URL
        fromService:
          type: web
          name: foodcovering-backend
          property: host

  # 2. FoodCovering 2.0 API & Telemetry Engine (Backend)
  - type: web
    name: foodcovering-backend
    env: node
    plan: free
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
